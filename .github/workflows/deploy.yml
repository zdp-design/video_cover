name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]  # 当 main 分支有推送时触发
  workflow_dispatch:   # 允许在 GitHub 网页上手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'  # 如果你的项目是CRA，请将 dist 改为 build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
